[project]
name = "stellaris-sluggy"
version = "0.1.3"
description = "CLI tool to scan Stellaris save files for star systems with dangerous wildlife (and other planet modifiers)"
readme = "README.md"
authors = [
    { name = "Kjetil Joergensen", email = "kjetijor@gmail.com" },
    { name = "Gemini" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stellaris-sluggy = "stellaris_sluggy.cli:main"

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"
